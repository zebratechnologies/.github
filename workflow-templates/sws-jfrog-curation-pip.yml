name: JFrog Curation Audit (pip)

# Audits Python (pip) dependencies against Zebra JFrog Curation policies.
# Required secrets in GitHub Environments (Dev and Dev-CI):
#   JFROG_URL              - e.g. https://artifactory-us.zebra.com
#   JFROG_USERNAME         - Artifactory service account username
#   JFROG_IDENTITY_TOKEN   - Artifactory identity/reference token
# Dev     — push and workflow_dispatch (may use "Protected branches only")
# Dev-CI  — pull_request only; set deployment branches to "No restriction"
# Fork PRs are skipped — GitHub does not expose environment secrets to workflows from forks.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  curation-audit:
    name: JFrog Curation Audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'Dev-CI' || 'Dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JFROG_URL }}
          JF_USER: ${{ secrets.JFROG_USERNAME }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_IDENTITY_TOKEN }}

      - name: Validate JFrog connection
        run: jf rt ping

      - name: Configure pip for Artifactory
        run: jf pip-config --repo-resolve=pypi-proxy

      - name: JFrog Curation Audit
        id: curation
        run: |
          set +e
          jf curation-audit 2>&1 | tee curation-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment curation summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- jfrog-curation-audit -->';
            const exitCode = '${{ steps.curation.outputs.exit_code }}';

            let output = '';
            try {
              output = fs.readFileSync('curation-output.txt', 'utf8').trim();
            } catch (e) {
              output = 'No output captured.';
            }

            // GitHub comments have a 65536 char limit; keep room for wrapper markdown.
            const MAX = 60000;
            if (output.length > MAX) {
              output = output.slice(0, MAX) + '\n...\n(output truncated, see the workflow logs for the full report)';
            }

            const status = exitCode === '0'
              ? ':white_check_mark: **No blocked packages found.**'
              : ':x: **Blocked packages detected.** Review the details below and update the affected dependencies.';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '### JFrog Curation Audit',
              '',
              status,
              '',
              '<details><summary>Full audit output</summary>',
              '',
              '```text',
              output,
              '```',
              '',
              '</details>',
              '',
              `[View workflow run](${runUrl})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
