name: JFrog Curation Audit (npm)

# Audits npm dependencies against Zebra JFrog Curation policies.
# Required secrets in the Dev GitHub Environment:
#   JF_URL, JF_USER, JF_PASSWORD
# Fork PRs are skipped — GitHub does not expose environment secrets to workflows from forks.
# For pull_request events, Dev must allow all branches (not "Protected branches only"),
# because GitHub runs PR workflows on refs/pull/<number>/merge.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  curation-audit:
    name: JFrog Curation Audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.16.0"
          cache: npm

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}

      - name: Validate JFrog connection
        run: jf rt ping

      - name: Configure npm for Artifactory
        run: jf npm-config --repo-resolve=npm-proxy

      - name: JFrog Curation Audit
        run: jf curation-audit
